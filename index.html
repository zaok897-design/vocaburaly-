<title>ЭЕШ Vocabulary</title>
<style>
:root{--bg:#f4f8ff;--bg2:#ffffff;--card:#ffffff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pri:#2563eb;--pri2:#06b6d4;--ok:#059669;--okbg:#d1fae5;--bad:#e11d48;--badbg:#ffe4e6;--warn:#b45309;--warnbg:#fef3c7;--chip:#eef2ff;--sh:0 1px 3px rgba(15,23,42,.08)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(135deg,var(--bg),var(--bg2));min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{max-width:820px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;border:0;cursor:pointer;padding:0}
nav{max-width:820px;margin:0 auto;padding:4px 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}

.mu{color:var(--mu)}.sm{font-size:13px}.c{text-align:center}

.chip:disabled{opacity:.4;cursor:not-allowed}

label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mu)}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:11px;margin:7px 0;font:inherit;cursor:pointer}

.opt.sel{border-color:var(--pri);background:var(--chip)}

.opt i{font-style:normal;font-weight:700;background:var(--chip);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;flex:none}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s}

.alert.w{background:var(--warnbg);color:var(--warn)}.alert.e{background:var(--badbg);color:var(--bad)}.alert.s{background:var(--okbg);color:var(--ok)}
.fc{min-height:210px;display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}
.fc .big{font-size:34px;font-weight:800;word-break:break-word}
.icon{border:1px solid var(--bd);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none}
.wr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.wr:last-child{border:0}
.qm{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.qm button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:13px}
.qm button.a{background:var(--chip);border-color:var(--pri)}.qm button.cur{outline:2px solid var(--pri2)}
.big-pct{font-size:56px;font-weight:800;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;display:none;z-index:9}
a{color:var(--pri)}
@media(max-width:480px){h1{font-size:21px}.fc .big{font-size:28px}}
</style>
</head>

<script>
"use strict";
/* ===================== ТОХИРГОО ===================== */
const CONFIG = {
  // Google Apps Script "Web app" URL
  API_URL: "https://script.google.com/macros/s/AKfycbxxapJjeKoMqnE35nVoi7iP2309khake01DZPOEKNDKVTcMZHBcJzAH6mvqap34fXw0Xg/exec",
  DAILY_NEW: 10 // өдөрт нэмж үзэх шинэ үгийн тоо
};

/* ===================== ТУСЛАХ ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = (area) => ({
  get(k, d) { try { const v = window[area].getItem("ese." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { window[area].setItem("ese." + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { window[area].removeItem("ese." + k); } catch (e) {} }
});
const LS = store("localStorage"), SS = store("sessionStorage");
const dstr = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const L = "ABCDE", LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
const app = $("#app");
function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); }

const D = {
  sets: window.QSETS || [], vocab: window.VOCAB || [], topics: window.VOCAB_TOPICS || [],
  ex: window.EXAMPLES || {}, tr: window.TRANSLATION || [], demo: window.DEMO_SET || null
};
const lvlOf = w => (D.ex[w] || {}).l || "";
const topicName = id => (D.topics.find(t => t.id === id) || {}).mn || id;

async function api(action, data) {
  if (!CONFIG.API_URL) throw new Error("Сервер холбогдоогүй байна (index.html доторх CONFIG.API_URL хоосон).");
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 30000);
  try {
    const r = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...data }), signal: ac.signal });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.error || "Серверийн алдаа"); e.auth = j.auth; throw e; }
    return j;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Сервер хариу өгсөнгүй (хугацаа дууслаа). Дахин оролдоно уу.");
    if (e instanceof TypeError) throw new Error("Сервертэй холбогдож чадсангүй. Интернэтээ шалгана уу.");
    throw e;
  } finally { clearTimeout(to); }
}

/* ===================== ДУУДЛАГА (Web Speech API) ===================== */
const TTS = {
  ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  accent: LS.get("accent", "en-US"), rate: LS.get("rate", 0.95), last: "",
  voices() { return this.ok ? speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(this.accent.toLowerCase())) : []; },
  allEnglish() { return this.ok ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : []; },
  speak(text) {
    if (!this.ok) { toast("Энэ хөтөч дуу хоолой (text-to-speech) дэмждэггүй байна. Chrome, Edge эсвэл Safari туршаад үзнэ үү."); return false; }
    if (!text || !text.trim()) { toast("Сонсох текстээ бичнэ үү."); return false; }
    this.last = text;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = this.accent; u.rate = this.rate;
    const v = this.voices()[0]; if (v) u.voice = v;
    u.onerror = e => { if (e.error !== "canceled" && e.error !== "interrupted") toast("Дуу хоолой тоглуулж чадсангүй (" + (e.error || "алдаа") + "). Төхөөрөмжийнхөө дууг шалгана уу."); };
    if (!v && !this.allEnglish().length) toast("Энэ төхөөрөмжид " + this.accent + " дуу хоолой олдсонгүй. Дуу гарахгүй байж болно.", 5000);
    speechSynthesis.speak(u);
    return true;
  },
  pause() { if (this.ok) speechSynthesis.pause(); },
  resume() { if (this.ok) speechSynthesis.resume(); },
  stop() { if (this.ok) speechSynthesis.cancel(); }
};
if (TTS.ok) speechSynthesis.onvoiceschanged = () => { if (cur === "speak") views.speak(); };

/* ===================== ЦЭС / ЗАМЧЛАЛ ===================== */
const ROUTES = [
  { id: "home", t: "Нүүр" }, { id: "vocab", t: "Vocabulary" }, { id: "tests", t: "ЭЕШ 2021–2025" },
  { id: "mn-en", t: "Монгол → Англи" }, { id: "en-mn", t: "Англи → Монгол" }, { id: "cards", t: "Үг цээжлэх карт" },
  { id: "speak", t: "Дуудлага" }, { id: "progress", t: "Миний ахиц" }, { id: "teacher", t: "Багшийн тайлан" }
];
$("#nav").innerHTML = ROUTES.map(r => `<a href="#${r.id}" data-r="${r.id}">${r.t}</a>`).join("");
function theme(dark) {
  if (dark === undefined) { const s = LS.get("theme", null); dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").textContent = dark ? "☀️ Гэрэлтэй" : "🌙 Харанхуй";
}
$("#theme").onclick = () => { const d = document.documentElement.dataset.theme !== "dark"; LS.set("theme", d ? "dark" : "light"); theme(d); };
let timerId = null, cur = (location.hash || "#home").slice(1);
// Хуудас солих: hash-д найдахгүй (iframe/preview дотор hash ажиллахгүй байж болно)
function go(id) {
  cur = views[id] ? id : "home";
  try { history.replaceState(null, "", "#" + cur); } catch (e) { try { location.hash = cur; } catch (e2) {} }
  route();
}
$("#logo").onclick = () => go("home");
function route() {
  clearInterval(timerId); TTS.stop();
  const r = views[cur] ? cur : "home";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  views[r]();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { const id = (location.hash || "#home").slice(1); if (id !== cur) { cur = id; route(); } });
// Бүх "#..." холбоос (цэс, нүүр хуудасны картууд) go()-оор ажиллана
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest('a[href^="#"]'); if (a) { e.preventDefault(); go(a.getAttribute("href").slice(1)); } });

/* ===================== ҮГИЙН ЯВЦ (Leitner) ===================== */
const INTERVALS = [0, 1, 3, 7, 14, 30];
const cardStore = () => LS.get("cards", {});
function cardStats() {
  const st = cardStore(), td = dstr();
  const seen = D.vocab.filter(v => st[v.w]);
  return {
    total: D.vocab.length, seen: seen.length,
    memorized: seen.filter(v => st[v.w].b >= 3).length,
    due: seen.filter(v => st[v.w].d <= td).length,
    unknown: seen.filter(v => st[v.w].r === 0).length
  };
}
const statusIcon = w => { const c = cardStore()[w]; return !c ? "" : c.b >= 3 ? "✅" : c.r === 0 ? "🔁" : "🕓"; };

/* ===================== VIEWS ===================== */
const views = {};

/* ---------- Нүүр ---------- */
views.home = () => {
  const cs = cardStats(), hist = LS.get("history", []);
  const desc = {
    vocab: `${D.topics.length} сэдэв · ${D.vocab.length} үг`,
    tests: `${D.sets.length} багц · ${D.sets.reduce((a, s) => a + s.questions.length, 0)} асуулт`,
    "mn-en": "Үг, өгүүлбэр · A1–C2", "en-mn": "Үг, өгүүлбэр · A1–C2",
    cards: `Өнөөдөр давтах: ${cs.due} · Цээжилсэн: ${cs.memorized}`, speak: "en-US / en-GB",
    progress: `${hist.length} тест өгсөн`, teacher: "Нууц үгтэй"
  };
  const icon = { vocab: "📚", tests: "📝", "mn-en": "🇲🇳", "en-mn": "🇬🇧", cards: "🃏", speak: "🔊", progress: "📈", teacher: "🔐" };
  app.innerHTML = `<h1>Сайн уу 👋</h1><p class="mu">Англи хэлний үгийн сан, ЭЕШ-ийн бодит асуултаар бэлдэнэ.</p>
  <div class="grid w2">${ROUTES.slice(1).map(r => `<a class="tile" href="#${r.id}"><b>${icon[r.id]} ${r.t}</b><span class="mu sm">${desc[r.id]}</span></a>`).join("")}</div>`;
};

/* ---------- Vocabulary (сэдвээр) ---------- */
const VS = { topic: null, q: "" };
function wordRow(v) {
  const e = D.ex[v.w], l = e && e.l;
  return `<div class="wr"><button class="icon" data-act="say" data-w="${esc(v.w)}" aria-label="Дуудлага сонсох">🔊</button>
  <div style="flex:1"><b>${esc(v.w)}</b> ${l ? `<span class="badge">${l}</span>` : ""} <span>${statusIcon(v.w)}</span>
  <div class="mu">${esc(v.m)}</div>${e ? `<div class="sm"><i>${esc(e.ex)}</i> — ${esc(e.mn)}</div>` : ""}</div></div>`;
}
function vocabList() {
  const q = VS.q.trim().toLowerCase();
  let list = D.vocab;
  if (VS.topic) list = list.filter(v => v.t.includes(VS.topic));
  if (q) list = list.filter(v => v.w.toLowerCase().includes(q) || v.m.toLowerCase().includes(q));
  return list.length ? list.map(wordRow).join("") : `<p class="mu">Үг олдсонгүй.</p>`;
}
views.vocab = () => {
  if (!D.vocab.length) { app.innerHTML = `<div class="alert e">Vocabulary өгөгдөл (data/vocab.js) ачаалагдсангүй.</div>`; return; }
  const st = cardStore();
  if (!VS.topic && !VS.q) {
    app.innerHTML = `<h1>📚 Vocabulary</h1><p class="mu">Сэдвээ сонгоод үгсийг үзэх, дуудлагыг сонсох, картаар давтах боломжтой.</p>
    <input id="vsearch" placeholder="Үг хайх (англи эсвэл монгол)…" value="${esc(VS.q)}" autocomplete="off">
    <div class="grid w2" style="margin-top:12px">${D.topics.map(t => {
      const ws = D.vocab.filter(v => v.t.includes(t.id)), m = ws.filter(v => st[v.w] && st[v.w].b >= 3).length;
      return `<button class="tile" data-act="topic" data-id="${t.id}"><b>${esc(t.mn)}</b><span class="mu sm">${esc(t.en)}</span>
      <div class="bar" style="margin:8px 0 4px"><div style="width:${ws.length ? m / ws.length * 100 : 0}%"></div></div><span class="sm">${ws.length} үг · цээжилсэн ${m}</span></button>`;
    }).join("")}</div>`;
  } else {
    const t = D.topics.find(x => x.id === VS.topic);
    app.innerHTML = `<div class="row sp"><button class="btn g" data-act="vback">← Сэдвүүд</button>${VS.topic ? `<button class="btn" data-act="vcards">🃏 Картаар давтах</button>` : ""}</div>
    <h2>${t ? esc(t.mn) : "Хайлтын үр дүн"}</h2>
    <input id="vsearch" placeholder="Энэ жагсаалтаас хайх…" value="${esc(VS.q)}" autocomplete="off">
    <div class="card" id="vlist">${vocabList()}</div>`;
  }
};

/* ---------- ЭЕШ тест ---------- */
const TS = { phase: "pick", year: null, setId: null, set: null, demo: false, ans: {}, i: 0, t0: 0, name: "", cls: "", res: null, err: "" };
function setLabel(s) { return `ЭЕШ ${s.year} · ${s.variant} хувилбар`; }
views.tests = () => {
  if (TS.phase === "pick") return testPick();
  if (TS.phase === "info") return testInfo();
  if (TS.phase === "run") return testRun();
  if (TS.phase === "sending") { app.innerHTML = `<div class="card c"><h2>Илгээж байна…</h2><p class="mu">Сервер таны хариултыг шалгаж, багшид дүнг илгээж байна.</p></div>`; return; }
  if (TS.phase === "result") return testResult();
};

const ENC = { "i'm": "i am", "i've": "i have", "i'll": "i will", "i'd": "i would", "we'll": "we will", "we're": "we are", "we've": "we have", "it's": "it is", "he's": "he is", "she's": "she is", "isn't": "is not", "aren't": "are not", "wasn't": "was not", "weren't": "were not", "don't": "do not", "doesn't": "does not", "didn't": "did not", "can't": "cannot", "won't": "will not", "hasn't": "has not", "haven't": "have not" };
function norm(s, en) {
  s = String(s).toLowerCase().replace(/[’‘]/g, "'");
  if (en) s = s.replace(/\b[a-z]+'[a-z]+\b/g, m => ENC[m] || m);
  return s.replace(/[^\p{L}\p{N}\s']/gu, " ").replace(/\s+/g, " ").trim().replace(/\bcannot\b/g, "can not");
}
function sim(a, b) {
  if (a === b) return 1; const m = a.length, n = b.length; if (!m || !n) return 0;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return 1 - p[n] / Math.max(m, n);
}

  }
  if (CS.mode === "new") return shuffle(pool.filter(v => !st[v.w])).slice(0, 20);

  const v = TTS.voices().length, all = TTS.allEnglish().length;
  const samples = shuffle(D.vocab).slice(0, 8).map(x => x.w);
  app.innerHTML = `<h1>🔊 Англи дуудлага</h1>
  ${TTS.ok ? "" : `<div class="alert e">Таны хөтөч дуу хоолой (text-to-speech) дэмждэггүй байна. Chrome, Edge эсвэл Safari-г туршаад үзнэ үү.</div>`}
  <div class="card"><label for="stext">Үг эсвэл өгүүлбэр</label><textarea id="stext" rows="3" placeholder="Жишээ: sustainable development">${esc(TTS.last)}</textarea>
  <label>Аялгуу</label><div class="row"><button class="chip ${TTS.accent === "en-US" ? "on" : ""}" data-act="accent" data-v="en-US">🇺🇸 en-US</button><button class="chip ${TTS.accent === "en-GB" ? "on" : ""}" data-act="accent" data-v="en-GB">🇬🇧 en-GB</button></div>
  <label for="srate">Хурд: <span id="srv">${TTS.rate}</span></label><input id="srate" type="range" min="0.5" max="1.5" step="0.05" value="${TTS.rate}">
  <div class="row" style="margin-top:12px"><button class="btn" data-act="splay">▶ Сонсох</button><button class="btn g" data-act="spause">⏸ Түр зогсоох</button><button class="btn g" data-act="sresume">⏯ Үргэлжлүүлэх</button><button class="btn g" data-act="sstop">⏹ Зогсоох</button><button class="btn g" data-act="sreplay">🔁 Дахин тоглуулах</button></div>
  ${TTS.ok ? `<p class="sm mu">Олдсон ${TTS.accent} дуу хоолой: ${v}${v ? "" : all ? " (англи дуу хоолой байгаа боловч энэ аялгуугаар биш)" : " — энэ төхөөрөмжид англи дуу хоолой суугаагүй байж болно"}. Дуу гарах эсэх нь таны төхөөрөмж, хөтчөөс хамаарна.</p>` : ""}</div>
  <h3>Түргэн сонголт</h3><div class="row">${samples.map(w => `<button class="chip" data-act="sayw" data-w="${esc(w)}">🔊 ${esc(w)}</button>`).join("")}</div>`;
  const r = $("#srate"); if (r) r.oninput = () => { TTS.rate = +r.value; LS.set("rate", TTS.rate); $("#srv").textContent = TTS.rate; };
};

/* ---------- Миний ахиц ---------- */
views.progress = () => {
  const cs = cardStats(), hist = LS.get("history", []).slice().reverse(), tr = LS.get("tr", { total: 0, correct: 0, by: {} }), st = cardStore();
  app.innerHTML = `<h1>📈 Миний ахиц</h1><p class="sm mu">Энэ хуудасны мэдээлэл зөвхөн таны төхөөрөмж дээр хадгалагдана.</p>
  <div class="grid"><div class="card c" style="margin:0"><b style="font-size:22px">${cs.memorized}</b><div class="sm mu">Цээжилсэн үг</div></div>
  <div class="card c" style="margin:0"><b style="font-size:22px">${cs.seen}/${cs.total}</b><div class="sm mu">Үзсэн үг</div></div>
  <div class="card c" style="margin:0"><b style="font-size:22px">${cs.due}</b><div class="sm mu">Өнөөдөр давтах</div></div>
  <div class="card c" style="margin:0"><b style="font-size:22px">${cs.unknown}</b><div class="sm mu">Мэдээгүй үг</div></div></div>
  <h2>Сэдвээр</h2><div class="card">${D.topics.map(t => { const ws = D.vocab.filter(v => v.t.includes(t.id)), m = ws.filter(v => st[v.w] && st[v.w].b >= 3).length;
    return `<div style="margin:8px 0"><div class="row sp sm"><span>${esc(t.mn)}</span><span>${m}/${ws.length}</span></div><div class="bar"><div style="width:${ws.length ? m / ws.length * 100 : 0}%"></div></div></div>`; }).join("")}</div>
  <h2>Орчуулга</h2><div class="card">${tr.total ? `<p>Нийт <b>${tr.correct}/${tr.total}</b> зөв (${Math.round(tr.correct / tr.total * 100)}%)</p>${LEVELS.filter(l => tr.by[l]).map(l => `<div class="row sp sm"><span>${l}</span><span>${tr.by[l].c}/${tr.by[l].t}</span></div>`).join("")}` : `<p class="mu">Орчуулгын дасгал хараахан хийгээгүй байна.</p>`}</div>
  <h2>ЭЕШ-ийн тестүүд</h2><div class="card tw">${hist.length ? `<table><tr><th>Огноо</th><th>Багц</th><th>Зөв</th><th>Хувь</th></tr>${hist.slice(0, 20).map(h => `<tr><td>${esc(new Date(h.d).toLocaleDateString("mn-MN"))}</td><td>${esc(h.set)}</td><td>${h.p !== undefined ? h.c + "/" + h.t : "—"}</td><td>${h.p !== undefined ? h.p + "%" : "Багшид илгээсэн"}</td></tr>`).join("")}</table>` : `<p class="mu">Тест хараахан өгөөгүй байна.</p>`}</div>
  <h2>Хувийн мэдээлэл</h2><div class="card"><p class="sm mu">Хадгалсан ахиц, нэр, ангиа энэ төхөөрөмжөөс устгаж болно. (Багшид илгээсэн дүн устахгүй.)</p><button class="btn bad" data-act="wipe">🗑 Миний мэдээллийг устгах</button></div>`;
};

/* ---------- Багшийн тайлан ---------- */
const TC = { token: SS.get("tok", null), rows: [], cls: "all", set: "all", q: "", err: "", loading: false };
function csvCell(v) { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
function teacherFiltered() { const q = TC.q.trim().toLowerCase(); return TC.rows.filter(r => (TC.cls === "all" || r.cls === TC.cls) && (TC.set === "all" || r.setId === TC.set) && (!q || r.name.toLowerCase().includes(q))); }
views.teacher = () => {
  if (!TC.token) {
    app.innerHTML = `<h1>🔐 Багшийн дүнгийн тайлан</h1><div class="card"><form data-form="tlogin"><label for="tpw">Багшийн нууц үг</label><input id="tpw" type="password" required autocomplete="current-password">
    ${TC.err ? `<div class="alert e">${esc(TC.err)}</div>` : ""}${CONFIG.API_URL ? "" : `<div class="alert w">Сервер холбогдоогүй байна (CONFIG.API_URL).</div>`}
    <button class="btn" type="submit" style="margin-top:10px" ${TC.loading ? "disabled" : ""}>${TC.loading ? "Шалгаж байна…" : "Нэвтрэх"}</button></form>
    <p class="sm mu">Дүнгүүд Google Sheets-ийн "Results" таб дээр мөн автоматаар хадгалагдана. Сурагчид энэ хэсгийг харах боломжгүй.</p></div>`;
    return;
  }
  const rows = teacherFiltered().slice().sort((a, b) => b.date.localeCompare(a.date));
  const classes = [...new Set(TC.rows.map(r => r.cls))].sort(), sets = [...new Set(TC.rows.map(r => r.setId))].sort();
  const avg = rows.length ? Math.round(rows.reduce((a, r) => a + r.percent, 0) / rows.length * 10) / 10 : 0;
  const byCls = {}; rows.forEach(r => { (byCls[r.cls] = byCls[r.cls] || []).push(r.percent); });
  app.innerHTML = `<div class="row sp"><h1>🔐 Багшийн тайлан</h1><div class="row"><button class="btn g" data-act="trefresh">⟳ Шинэчлэх</button><button class="btn g" data-act="tlogout">Гарах</button></div></div>
  ${TC.err ? `<div class="alert e">${esc(TC.err)}</div>` : ""}
  <div class="card"><div class="grid"><div><label>Анги</label><select id="tcls"><option value="all">Бүгд</option>${classes.map(c => `<option ${TC.cls === c ? "selected" : ""} value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
  <div><label>Багц</label><select id="tset"><option value="all">Бүгд</option>${sets.map(c => `<option ${TC.set === c ? "selected" : ""} value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
  <div><label>Нэрээр хайх</label><input id="tq" value="${esc(TC.q)}"></div></div></div>
  <div class="grid"><div class="card c" style="margin:0"><b style="font-size:22px">${rows.length}</b><div class="sm mu">Оролдлого</div></div><div class="card c" style="margin:0"><b style="font-size:22px">${avg}%</b><div class="sm mu">Дундаж</div></div>
  <div class="card c" style="margin:0"><b style="font-size:22px">${rows.length ? Math.max(...rows.map(r => r.percent)) : 0}%</b><div class="sm mu">Дээд</div></div><div class="card c" style="margin:0"><b style="font-size:22px">${rows.length ? Math.min(...rows.map(r => r.percent)) : 0}%</b><div class="sm mu">Доод</div></div></div>
  ${Object.keys(byCls).length ? `<h2>Ангиар дундаж</h2><div class="card">${Object.entries(byCls).map(([c, a]) => `<div class="row sp sm"><span>${esc(c)} (${a.length})</span><b>${Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10}%</b></div>`).join("")}</div>` : ""}
  <div class="row sp"><h2>Дүнгийн жагсаалт</h2><button class="btn" data-act="tcsv" ${rows.length ? "" : "disabled"}>⬇ CSV татах</button></div>
  <div class="card tw">${rows.length ? `<table><tr><th>Огноо</th><th>Нэр</th><th>Анги</th><th>Багц</th><th>Зөв</th><th>Буруу</th><th>Хоосон</th><th>Хувь</th></tr>${rows.map(r => `<tr><td>${esc(new Date(r.date).toLocaleString("mn-MN"))}</td><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${esc(r.setId)}</td><td>${r.correct}/${r.total}</td><td>${r.wrong}</td><td>${r.blank}</td><td><b>${r.percent}%</b></td></tr>`).join("")}</table>` : `<p class="mu">Дүн олдсонгүй.</p>`}</div>`;
};
async function teacherLoad() {
  TC.err = ""; TC.loading = true;
  try { const r = await api("teacherResults", { token: TC.token }); TC.rows = r.rows; }
  catch (e) { TC.err = e.message; if (e.auth === false) { TC.token = null; SS.del("tok"); } }
  TC.loading = false; if (cur === "teacher") views.teacher();
}

/* ===================== ҮЙЛДЛИЙН ХЭРЭГЖҮҮЛЭГЧ ===================== */
const A = {
  say: t => TTS.speak(t.dataset.w), sayw: t => TTS.speak(t.dataset.w), sayt: t => TTS.speak(t.dataset.t),
  // vocab
  topic: t => { VS.topic = t.dataset.id; VS.q = ""; views.vocab(); },
  vback: () => { VS.topic = null; VS.q = ""; views.vocab(); },
  vcards: () => { CS.topic = VS.topic; CS.mode = "all"; CS.level = "all"; CS.started = false; go("cards"); },
  // tests
  year: t => { TS.year = +t.dataset.y; views.tests(); },
  startset: t => { TS.set = D.sets.find(s => s.id === t.dataset.id); TS.setId = TS.set.id; TS.demo = false; TS.phase = "info"; views.tests(); },
  startdemo: () => { TS.set = D.demo; TS.setId = "DEMO"; TS.demo = true; TS.phase = "info"; views.tests(); },
  tback: () => { TS.phase = "pick"; TS.err = ""; views.tests(); },
  tagain: () => { TS.ans = {}; TS.i = 0; TS.t0 = Date.now(); TS.phase = "run"; views.tests(); },
  pick: t => { TS.ans[TS.set.questions[TS.i].n] = +t.dataset.k; views.tests(); },
  clearq: () => { delete TS.ans[TS.set.questions[TS.i].n]; views.tests(); },
  prevq: () => { TS.i = Math.max(0, TS.i - 1); views.tests(); window.scrollTo(0, 0); },
  nextq: () => { TS.i = Math.min(TS.set.questions.length - 1, TS.i + 1); views.tests(); window.scrollTo(0, 0); },
  jump: t => { TS.i = +t.dataset.i; views.tests(); window.scrollTo(0, 0); },
  finish: () => finishTest(),
  // translation
  trlevel: t => { const S = TR[t.dataset.d]; S.level = t.dataset.v; S.started = false; trView(t.dataset.d); },
  trtype: t => { const S = TR[t.dataset.d]; S.type = t.dataset.v; S.started = false; trView(t.dataset.d); },
  trstart: t => { const S = TR[t.dataset.d]; S.q = shuffle(D.tr.filter(x => (S.level === "all" || x.l === S.level) && (S.type === "all" || x.t === S.type))); S.i = 0; S.res = null; S.started = true; trView(t.dataset.d); },
  trrestart: t => { TR[t.dataset.d].started = false; trView(t.dataset.d); },
  trskip: t => { const S = TR[t.dataset.d]; S.res = { st: "no", input: "", rec: false }; trView(t.dataset.d); },
  trself: t => { const S = TR[t.dataset.d]; trRecord(S.q[S.i], t.dataset.v === "1"); S.res.rec = true; trView(t.dataset.d); },
  trnext: t => { const S = TR[t.dataset.d]; if (S.res && S.res.st !== "ok" && !S.res.rec) trRecord(S.q[S.i], false); S.i++; S.res = null; trView(t.dataset.d); window.scrollTo(0, 0); },
  // cards
  cstart: () => { CS.mode = $("#fmode").value; CS.topic = $("#ftopic").value; CS.level = $("#flevel").value; CS.q = buildQueue(); CS.i = 0; CS.flip = false; CS.know = 0; CS.again = 0; CS.retried = new Set(); CS.started = true; if (!CS.q.length) { toast("Энэ сонголтоор давтах үг алга. Өөр горим/сэдэв сонгоно уу.", 5000); CS.started = false; } views.cards(); },
  cflip: () => { CS.flip = !CS.flip; views.cards(); },
  cknow: () => { cardGrade(true); views.cards(); },
  cagain: () => { cardGrade(false); views.cards(); },
  cquit: () => { CS.started = false; views.cards(); },
  // speak
  accent: t => { TTS.accent = t.dataset.v; LS.set("accent", TTS.accent); views.speak(); },
  splay: () => { TTS.speak($("#stext").value); },
  spause: () => TTS.pause(), sresume: () => TTS.resume(), sstop: () => TTS.stop(),
  sreplay: () => { const t = $("#stext").value || TTS.last; TTS.speak(t); },
  // progress
  wipe: () => { if (!confirm("Таны төхөөрөмж дээр хадгалсан бүх ахиц, нэр, ангийг устгах уу?")) return; ["cards", "newToday", "history", "tr", "student", "accent", "rate"].forEach(k => LS.del(k)); toast("Устгалаа."); views.progress(); },
  // teacher
  tlogout: async () => { const tk = TC.token; TC.token = null; TC.rows = []; SS.del("tok"); try { await api("teacherLogout", { token: tk }); } catch (e) {} views.teacher(); },
  trefresh: () => teacherLoad(),
  tcsv: () => {
    const rows = teacherFiltered(), head = ["Огноо", "Нэр", "Анги", "Багц", "Нийт", "Зөв", "Буруу", "Хоосон", "Хувь"];
    const csv = "﻿" + [head, ...rows.map(r => [r.date, r.name, r.cls, r.setId, r.total, r.correct, r.wrong, r.blank, r.percent])].map(r => r.map(csvCell).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "ese_dun_" + dstr() + ".csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};
app.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && A[t.dataset.act]) A[t.dataset.act](t, e); });
app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".fc[data-act]")) { e.preventDefault(); A.cflip(); } });
app.addEventListener("input", e => {
  if (e.target.id === "vsearch") { VS.q = e.target.value; const l = $("#vlist"); if (l) l.innerHTML = vocabList(); else if (VS.q) { views.vocab(); const s = $("#vsearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  if (e.target.id === "tq") { TC.q = e.target.value; views.teacher(); const s = $("#tq"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
});
app.addEventListener("change", e => {
  if (e.target.id === "tcls") { TC.cls = e.target.value; views.teacher(); }
  if (e.target.id === "tset") { TC.set = e.target.value; views.teacher(); }
});
app.addEventListener("submit", async e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === "tinfo") {
    if (!TS.demo) { TS.name = $("#sn").value.trim(); TS.cls = $("#sc").value.trim(); if (TS.name.length < 2 || !TS.cls) return toast("Нэр, ангиа бөглөнө үү."); LS.set("student", { name: TS.name, cls: TS.cls }); }
    TS.ans = {}; TS.i = 0; TS.t0 = Date.now(); TS.phase = "run"; views.tests();
  } else if (k === "trcheck") {
    const dir = f.dataset.d, S = TR[dir], it = S.q[S.i], input = $("#trin").value.trim();
    if (!input) return toast("Хариултаа бичнэ үү.");
    const en = dir === "mn-en", n = norm(input, en), set = (en ? it.en : it.mn).map(a => norm(a, en));
    let st = "no"; if (set.includes(n)) st = "ok"; else if (Math.max(...set.map(s => sim(n, s))) >= 0.88) st = "near";
    S.res = { st, input, rec: false }; if (st === "ok") { trRecord(it, true); S.res.rec = true; }
    trView(dir);
  } else if (k === "tlogin") {
    TC.loading = true; TC.err = ""; views.teacher();
    try { const r = await api("teacherLogin", { password: $("#tpw").value }); TC.token = r.token; SS.set("tok", r.token); TC.loading = false; views.teacher(); teacherLoad(); }
    catch (er) { TC.loading = false; TC.err = er.message; views.teacher(); }
  }
});

/* ===================== ЭХЛҮҮЛЭХ ===================== */
theme();
if (!D.sets.length && !D.vocab.length) app.innerHTML = `<div class="alert e">Өгөгдлийн файлууд (data/*.js) ачаалагдсангүй. index.html-тэй хамт data хавтсыг байршуулсан эсэхээ шалгана уу.</div>`;
else { if (TC.token) teacherLoad(); route(); }
</script>
</body>
</html>
