<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Үгсийн сан</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fc;padding:20px;color:#0f172a}
.wrap{max-width:720px;margin:0 auto}
h1{text-align:center;color:#2563eb;margin-bottom:20px;font-size:24px}
.cats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.cb{padding:7px 13px;border-radius:20px;background:#fff;border:1.5px solid #e2e8f0;font-size:12px;font-weight:bold;color:#555;cursor:pointer}
.cb.active{background:#2563eb;color:#fff;border-color:#2563eb}
.card{background:#fff;border-radius:20px;padding:40px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08);min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;position:relative;margin-bottom:16px;transition:.3s}
.card.back{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
.lbl{font-size:11px;font-weight:bold;color:#888;letter-spacing:2px;margin-bottom:12px}
.card.back .lbl{color:rgba(255,255,255,.8)}
.word{font-size:34px;font-weight:800;margin-bottom:12px;word-break:break-word;line-height:1.2}
.ex{font-size:13px;color:#666;font-style:italic;margin-top:12px;padding-top:12px;border-top:1px solid #eee;max-width:480px}
.card.back .ex{color:rgba(255,255,255,.9);border-top-color:rgba(255,255,255,.3)}
.spk{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:#dbeafe;border:none;font-size:18px;cursor:pointer}
.card.back .spk{background:rgba(255,255,255,.3)}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:#999}
.card.back .hint{color:rgba(255,255,255,.75)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;font-size:14px;font-weight:bold;border:none;cursor:pointer}
.bp{background:#2563eb;color:#fff}
.bo{background:#fff;color:#333;border:1.5px solid #e2e8f0}
.info{text-align:center;color:#666;margin-bottom:12px;font-size:12px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.mb2{padding:8px 16px;border-radius:20px;background:#fff;border:1.5px solid #e2e8f0;font-size:12px;font-weight:bold;cursor:pointer}
.mb2.active{background:#0f172a;color:#fff;border-color:#0f172a}
.qbox{background:#fff;border-radius:16px;padding:24px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.qword{font-size:26px;font-weight:800;color:#2563eb;margin:14px 0 20px;word-break:break-word}
.qopt{display:block;width:100%;padding:13px 18px;margin-bottom:8px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.qopt:hover{border-color:#2563eb}
.qopt.ok{border-color:#16a34a;background:#dcfce7;color:#15803d}
.qopt.no{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.qfb{font-size:14px;font-weight:bold;margin:12px 0;min-height:20px}
.qsc{font-size:13px;color:#666;margin:10px 0}
@media(max-width:520px){.word{font-size:26px}body{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 English Vocabulary</h1>
<div class="cats" id="cats"></div>
<div class="modes">
  <button class="mb2 active" id="mFlash" onclick="setMode('flash')">📇 Карт</button>
  <button class="mb2" id="mQuiz" onclick="setMode('quiz')">🎯 Асуулт</button>
  <button class="mb2" onclick="shuffle()">🔀 Холих</button>
</div>

<!-- FLASH MODE -->
<div id="flashBox">
  <div class="info">Дарж эргүүлэх · 🔊 дарж сонсох · ← → товч</div>
  <div class="card" id="card" onclick="flip()">
    <button class="spk" onclick="speak(event)">🔊</button>
    <div class="lbl" id="lbl">ENGLISH</div>
    <div class="word" id="word">—</div>
    <div class="ex" id="ex"></div>
    <div class="hint" id="hint">Дарж эргүүлэх →</div>
  </div>
  <div class="btns">
    <button class="btn bo" onclick="prev()">← Өмнөх</button>
    <button class="btn bp" onclick="next()">Дараах →</button>
  </div>
  <div class="info" style="margin-top:12px"><span id="counter">1 / 1</span></div>
</div>

<!-- QUIZ MODE -->
<div id="quizBox" style="display:none">
  <div class="qbox">
    <div style="font-size:12px;color:#666;font-weight:bold">ЗӨВ ОРЧУУЛГЫГ СОНГО</div>
    <div class="qword" id="qWord">—</div>
    <div id="qOpts"></div>
    <div class="qfb" id="qFb"></div>
    <div class="qsc">Зөв: <b id="qOk">0</b> · Буруу: <b id="qNo">0</b></div>
    <button class="btn bp" id="qNext" style="display:none" onclick="nextQuiz()">Дараах →</button>
  </div>
</div>

</div>

var curCat='health';
var curWords=[];
var curIdx=0;
var back=false;
var mode='flash';
var qOk=0,qNo=0,qAns=false;

function initCats(){
  var box=document.getElementById('cats');box.innerHTML='';
  for(var k in DATA){
    var b=document.createElement('button');
    b.className='cb'+(k===curCat?' active':'');
    b.textContent=DATA[k].name;
    b.setAttribute('data-k',k);
    b.onclick=function(){pickCat(this.getAttribute('data-k'));};
    box.appendChild(b);
  }
}

function pickCat(k){
  curCat=k;curWords=DATA[k].words.slice();curIdx=0;back=false;qOk=0;qNo=0;
  var bs=document.querySelectorAll('.cb');
  for(var i=0;i<bs.length;i++){
    if(bs[i].getAttribute('data-k')===k)bs[i].classList.add('active');
    else bs[i].classList.remove('active');
  }
  if(mode==='flash')renderCard();else renderQuiz();
}

function renderCard(){
  if(!curWords.length)return;
  var w=curWords[curIdx];
  var c=document.getElementById('card');
  if(back){
    c.classList.add('back');
    document.getElementById('lbl').textContent='МОНГОЛ';
    document.getElementById('word').textContent=w.mn;
    document.getElementById('ex').textContent=w.ex;
    document.getElementById('hint').textContent='← Дарж буцаах';
  } else {
    c.classList.remove('back');
    document.getElementById('lbl').textContent='ENGLISH';
    document.getElementById('word').textContent=w.en;
    document.getElementById('ex').textContent=w.ex;
    document.getElementById('hint').textContent='Дарж эргүүлэх →';
  }
  document.getElementById('counter').textContent=(curIdx+1)+' / '+curWords.length;
}

function flip(){back=!back;renderCard();}
function next(){if(curIdx<curWords.length-1)curIdx++;else curIdx=0;back=false;renderCard();}
function prev(){if(curIdx>0)curIdx--;else curIdx=curWords.length-1;back=false;renderCard();}
function shuffle(){
  for(var i=curWords.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=curWords[i];curWords[i]=curWords[j];curWords[j]=t;
  }
  curIdx=0;back=false;renderCard();
}

function speak(e){
  if(e)e.stopPropagation();
  var w=curWords[curIdx];
  var txt=back?w.mn:w.en;
  var lang=back?'mn-MN':'en-US';
  if(!('speechSynthesis' in window)){alert('Browser дэмжихгүй');return;}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt);
  u.lang=lang;u.rate=0.85;
  window.speechSynthesis.speak(u);
}

function setMode(m){
  mode=m;
  document.getElementById('mFlash').classList.toggle('active',m==='flash');
  document.getElementById('mQuiz').classList.toggle('active',m==='quiz');
  if(m==='flash'){
    document.getElementById('flashBox').style.display='block';
    document.getElementById('quizBox').style.display='none';
    renderCard();
  } else {
    document.getElementById('flashBox').style.display='none';
    document.getElementById('quizBox').style.display='block';
    qOk=0;qNo=0;renderQuiz();
  }
}

function renderQuiz(){
  if(!curWords.length)return;
  qAns=false;
  var w=curWords[curIdx];
  document.getElementById('qWord').textContent=w.en;
  var opts=[w.mn];
  var pool=curWords.filter(function(x){return x.mn!==w.mn});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  for(var i=0;i<3&&i<pool.length;i++)opts.push(pool[i].mn);
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}
  var box=document.getElementById('qOpts');box.innerHTML='';
  for(var i=0;i<opts.length;i++){
    (function(o){
      var b=document.createElement('button');
      b.className='qopt';
      b.textContent=o;
      b.onclick=function(){checkQ(b,o,w.mn);};
      box.appendChild(b);
    })(opts[i]);
  }
  document.getElementById('qFb').textContent='';
  document.getElementById('qNext').style.display='none';
  document.getElementById('qOk').textContent=qOk;
  document.getElementById('qNo').textContent=qNo;
}

function checkQ(btn,chosen,correct){
  if(qAns)return;
  qAns=true;
  var all=document.querySelectorAll('.qopt');
  for(var i=0;i<all.length;i++)all[i].style.pointerEvents='none';
  if(chosen===correct){
    btn.classList.add('ok');
    document.getElementById('qFb').textContent='✓ Зөв!';
    document.getElementById('qFb').style.color='#16a34a';
    qOk++;
  } else {
    btn.classList.add('no');
    for(var i=0;i<all.length;i++){if(all[i].textContent===correct)all[i].classList.add('ok');}
    document.getElementById('qFb').textContent='✗ Буруу. Зөв: '+correct;
    document.getElementById('qFb').style.color='#dc2626';
    qNo++;
  }
  document.getElementById('qOk').textContent=qOk;
  document.getElementById('qNo').textContent=qNo;
  document.getElementById('qNext').style.display='inline-block';
}

function nextQuiz(){
  if(curIdx<curWords.length-1)curIdx++;else curIdx=0;
  renderQuiz();
}

document.getElementById('card').onclick=flip;
document.addEventListener('keydown',function(e){
  if(mode!=='flash')return;
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
  if(e.key===' '){e.preventDefault();flip();}
});

initCats();
pickCat('health');
</script>
